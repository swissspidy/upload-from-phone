name: Nightly Build

on:
    push:
        branches:
            - main

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
    # The concurrency group contains the workflow name and the branch name.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    build:
        name: Nightly Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Get current tag for HEAD
              run: |
                  echo "CURRENT_TAG=$(git tag --points-at HEAD)" >> $GITHUB_ENV

            # Not wp-cli:nightly: setup-php fetches that from a GitHub Releases
            # asset tagged `vnightly`, which wp-cli doesn't publish — its nightly
            # phar is only ever hosted at a different, non-Releases URL. The
            # install fails outright ("Failed to download wp-cli from
            # .../releases/download/vnightly/wp-cli-nightly.phar") rather than
            # falling back to stable, so this has to stay pinned to the
            # ordinary release channel.
            # github-token: '' — setup-php writes its github-token input into
            # Composer's global, job-wide auth.json while installing wp-cli
            # (to avoid GitHub API rate limits during the install itself).
            # That file persists for the rest of the job, and the value it
            # writes fails Composer's own validation ("invalid characters")
            # — which only surfaces later, the moment something needs that
            # auth. That something is the very next step: `wp package
            # install` registers this package as a VCS (git) repository
            # regardless of version (traced through
            # get_package_by_shortened_identifier() in wp-cli's own source —
            # it's not specific to :dev-main or being left unversioned), and
            # a VCS clone is exactly when Composer reaches for that token.
            # With none configured, it clones the (public) repo anonymously
            # instead.
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              with:
                  php-version: latest
                  coverage: none
                  tools: wp-cli
                  github-token: ''

            # :@stable resolves the latest tagged release via GitHub's
            # releases API rather than falling back to a dev branch — it
            # doesn't avoid the VCS path above (nothing does, for this
            # package), but it does mean the clone lands on a real release
            # instead of main.
            - name: Install latest version of dist-archive-command
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: wp package install wp-cli/dist-archive-command:@stable

            - name: Setup Node
              uses: actions/setup-node@v7
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install dependencies
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: npm ci

            - name: Build plugin
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: npm run build

            - name: Update version number
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: |
                  CURRENT_DATE=$(date +%Y.%-m.%-d)
                  sed -i -e "s/Version:.*/Version:           0.1.$CURRENT_DATE-${GITHUB_SHA::7}/g" ./upload-from-phone.php

            - name: Create updates information
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: |
                  CURRENT_DATE=$(date +%Y.%m.%d)
                  UPDATE=$(cat <<-END
                    {
                        "id": "https://swissspidy.github.io/upload-from-phone/update.json",
                        "slug": "upload-from-phone",
                        "version": "0.1.$CURRENT_DATE-${GITHUB_SHA::7}",
                        "url": "https://github.com/swissspidy/upload-from-phone",
                        "package": "https://swissspidy.github.io/upload-from-phone/nightly.zip",
                        "tested": "6.8",
                        "requires_php": "8.0",
                        "autoupdate": true
                    }
                  END

                  )

                  echo $UPDATE > update.json

            - name: Create ZIP file
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: wp dist-archive . ./upload-from-phone.zip

            - name: Prepare GitHub Pages
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: |
                  mkdir -p _site
                  mv update.json _site/update.json
                  cp ./upload-from-phone.zip _site/nightly.zip

            - name: Upload artifact
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              uses: actions/upload-pages-artifact@v5

            - name: Tag current commit
              if: ${{ env.CURRENT_TAG != 'nightly' }}
              run: |
                  git config --local user.email "swissspidy@users.noreply.github.com"
                  git config --local user.name "swissspidy-bot"
                  git push origin :refs/tags/nightly
                  git tag -f nightly
                  git push origin --tags

    # Deployment job
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
