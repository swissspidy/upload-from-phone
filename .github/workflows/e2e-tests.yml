name: E2E Tests

on:
    push:
        branches:
            - main
    pull_request:

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    e2e-tests:
        name: E2E Tests (WordPress ${{ matrix.wordpress }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # Matches "Requires at least" — 6.8 dropped after it surfaced a
                # WP-core-internal bug unrelated to this plugin (see #17).
                wordpress: ['7.1']

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Build plugin
              run: npm run build
              env:
                  WP_DEVTOOL: source-map
                  # To get CSS source maps.
                  NODE_ENV: development

            # Fetched from the exact zip WordPress.org serves for each build, rather
            # than the git mirror's branch: a branch tracks whatever unreleased
            # commits have landed since, not the released version a real site would
            # actually run.
            - name: Start WordPress
              run: npm run wp-env start
              env:
                  WP_ENV_CORE: https://wordpress.org/wordpress-${{ matrix.wordpress }}.zip

            - name: Run tests
              run: npm run test:e2e
              env:
                  COLLECT_COVERAGE: true

            - name: Upload code coverage report
              uses: codecov/codecov-action@v7.0.0
              # The reporter writes the coverage report before failed tests fail
              # the step above, so a red run shouldn't lose it — only skip when
              # coverage genuinely wasn't collected.
              if: ${{ always() && hashFiles('artifacts/e2e-coverage/coverage/codecov.json') != '' }}
              with:
                  files: artifacts/e2e-coverage/coverage/codecov.json
                  flags: e2e
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: Archive debug artifacts (screenshots, HTML snapshots)
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: failures-artifacts-${{ matrix.wordpress }}
                  path: artifacts
                  if-no-files-found: ignore
