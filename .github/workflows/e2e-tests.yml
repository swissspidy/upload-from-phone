name: E2E Tests

on:
    push:
        branches:
            - main
    pull_request:

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
    # The concurrency group contains the workflow name and the branch name.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    e2e-tests:
        name: E2E Tests (WordPress ${{ matrix.wordpress }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                wordpress: ['6.8', '7.1-RC4']

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Build plugin
              run: npm run build
              env:
                  WP_DEVTOOL: source-map
                  # To get CSS source maps.
                  NODE_ENV: development

            # Fetched from the exact zip WordPress.org serves for each build, rather
            # than the git mirror's branch: a branch tracks whatever unreleased
            # commits have landed since, not the released version a real site would
            # actually run — which is what broke the 6.8 leg (a WP-core-internal
            # error, not from this plugin, that only reproduced against branch HEAD).
            - name: Start WordPress
              run: npm run wp-env start
              env:
                  WP_ENV_CORE: https://wordpress.org/wordpress-${{ matrix.wordpress }}.zip

            - name: Run tests
              run: npm run test:e2e
              env:
                  # Only collected against the stable release — an RC's coverage
                  # numbers aren't meaningful to track over time, and one upload per
                  # push is all codecov needs.
                  COLLECT_COVERAGE: ${{ matrix.wordpress == '6.8' }}
                  # TODO: temporary, for diagnosing the WP 6.8 e2e failure — remove
                  # once that investigation is over.
                  E2E_DEBUG_LOG: ${{ matrix.wordpress == '6.8' }}

            - name: Upload code coverage report
              uses: codecov/codecov-action@v7.0.0
              # The reporter writes the coverage report before failed tests fail
              # the step above, so a red run shouldn't lose it — only skip when
              # coverage genuinely wasn't collected for this leg.
              if: ${{ always() && matrix.wordpress == '6.8' && hashFiles('artifacts/e2e-coverage/coverage/codecov.json') != '' }}
              with:
                  files: artifacts/e2e-coverage/coverage/codecov.json
                  flags: e2e
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: Archive debug artifacts (screenshots, HTML snapshots)
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: failures-artifacts-${{ matrix.wordpress }}
                  path: artifacts
                  if-no-files-found: ignore
