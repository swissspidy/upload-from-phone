name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint:js

      - run: npm run lint:css

      - run: npm run typecheck

      - run: npm run build

  php:
    name: PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          tools: composer

      - uses: ramsey/composer-install@v4

      - run: composer lint

      - run: composer phpstan

  test:
    name: Unit tests (WordPress ${{ matrix.wordpress }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Fully enumerated rather than a cross-product: it keeps the coverage
        # flag unambiguous per row instead of relying on `include` merge rules.
        include:
          - php: '8.0'
            wordpress: '6.8'
            coverage: false
          - php: '8.1'
            wordpress: 'latest'
            coverage: false
          - php: '8.2'
            wordpress: 'latest'
            coverage: false
          - php: '8.3'
            wordpress: 'latest'
            coverage: true
          - php: '8.4'
            wordpress: 'latest'
            coverage: false
          - php: '8.5'
            wordpress: 'latest'
            coverage: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - run: npm ci

      - run: npm run build

      - uses: ramsey/composer-install@v4

      # Coverage only on one leg — it roughly doubles the run (Xdebug slows
      # PHPUnit down a lot), and one upload per push is all codecov needs.
      - name: Start WordPress
        run: ./node_modules/.bin/wp-env start ${{ matrix.coverage && '--xdebug=coverage' || '' }}
        env:
          WP_ENV_CORE: ${{ matrix.wordpress == 'latest' && 'WordPress/WordPress' || format('WordPress/WordPress#{0}', matrix.wordpress) }}
          # PHPUnit runs inside the tests-cli container, not on the runner —
          # setup-php's `matrix.php` only affects the host, so the container
          # needs its own PHP version pinned or every leg would silently run
          # whatever PHP wp-env's image defaults to.
          WP_ENV_PHP_VERSION: ${{ matrix.php }}

      - name: Create coverage output directory
        if: ${{ matrix.coverage }}
        run: mkdir -p artifacts

      # Run wp-env directly: `npm run` swallows `--env-cwd` as an npm config
      # flag, so the plugin directory never reaches wp-env and PHPUnit is
      # looked for in the WordPress root instead.
      - name: Run tests
        run: >-
          ./node_modules/.bin/wp-env run tests-cli
          --env-cwd=wp-content/plugins/upload-from-phone
          vendor/bin/phpunit
          ${{ matrix.coverage && '--coverage-clover artifacts/coverage.xml' || '' }}

      - name: Upload code coverage report
        uses: codecov/codecov-action@v7.0.0
        if: ${{ matrix.coverage }}
        with:
          files: artifacts/coverage.xml
          flags: php
          token: ${{ secrets.CODECOV_TOKEN }}
